apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Read version from package.json
def getVersionFromPackageJson() {
    def packageJsonFile = file("$projectDir/../package.json")
    def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.text)
    return packageJson.version
}

android {
    def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION
    // Check AGP version for backward compatibility reasons (for RN < 0.71)
    if (agpVersion.tokenize('.')[0].toInteger() >= 7) {
        namespace "com.eko"
    }

    compileSdkVersion safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 36)
        versionCode 1
        versionName '1.0'

        // Support for 16KB memory page sizes (Android 15+)
        // Note: MMKV 2.x dropped armeabi-v7a support. If your app targets armeabi-v7a,
        // downgrade to MMKV 1.x in your app's build.gradle (see README for details).
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
        buildConfigField "String", "LIBRARY_VERSION", "\"${getVersionFromPackageJson()}\""
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ['src/newarch/java']
            } else {
                java.srcDirs += ['src/oldarch/java']
            }
        }
    }

    // Configure packaging options for 16KB page size support
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Framework calls the tests don't exercise (e.g. Log from a class
            // loaded outside a Robolectric environment) return a default instead
            // of throwing "not mocked"
            returnDefaultValues = true
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-native:+'

    // MMKV dependency for persistent download state storage
    // Uses compileOnly to avoid duplicate class errors when app also uses react-native-mmkv
    // The app must provide MMKV dependency (either directly or via react-native-mmkv)
    // MMKV 1.3.14+ supports both armeabi-v7a (32-bit) and 16KB page sizes (Android 15+)
    compileOnly 'com.tencent:mmkv-shared:1.3.16'

    implementation 'com.google.code.gson:gson:2.12.1'

    // Unit tests. Robolectric gives the tests a real JobScheduler, SharedPreferences
    // and Log without a device; MockWebServer backs the download-transfer tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
