apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

apply plugin: 'com.facebook.react'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Read version from package.json
def getVersionFromPackageJson() {
    def packageJsonFile = file("$projectDir/../package.json")
    def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.text)
    return packageJson.version
}

android {
    namespace "com.eko"

    compileSdkVersion safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 36)
        versionCode 1
        versionName '1.0'

        buildConfigField "String", "LIBRARY_VERSION", "\"${getVersionFromPackageJson()}\""
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Framework calls the tests don't exercise (e.g. Log from a class
            // loaded outside a Robolectric environment) return a default instead
            // of throwing "not mocked"
            returnDefaultValues = true
        }
    }
}

if (rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") != "true") {
    throw new GradleException("@anorak-games/react-native-background-downloader requires React Native's New Architecture")
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation 'com.facebook.react:react-native:+'

    // Unit tests. Robolectric provides Android framework behavior and
    // MockWebServer backs transfer tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
