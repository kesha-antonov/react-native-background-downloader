name: iOS

# The iOS build and unit tests take about 30 minutes, so they don't run on
# every push or pull request. Start this workflow from the Actions tab when a
# change touches iOS, or before a release.
on:
  workflow_dispatch:

# Read-only token: the job runs dependency install scripts and the build
permissions:
  contents: read

jobs:
  ios:
    name: iOS build and unit tests
    # Expo SDK 58's expo-modules-jsi needs Swift 6.2 (Xcode 26+)
    runs-on: macos-26
    env:
      # React Native's Podfile wraps clang in ccache when this is set at pod
      # install time; Expo modules come precompiled, so most of what is left
      # to compile is C, C++ and Objective-C that ccache can reuse
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show the Xcode version
        run: xcodebuild -version

      # React Native's ccache-clang.sh runs "$CCACHE_BINARY clang". Xcode keeps
      # CCACHE_BINARY as a build setting and doesn't pass it to the compiler's
      # environment, so without this export the wrapper runs plain clang
      - name: Install ccache
        run: |
          brew install ccache
          echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"

      # Saved after every run under a new key; the newest one is restored
      - name: Restore the ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ios-${{ github.sha }}
          restore-keys: ccache-ios-

      # Pod sources and React Native's prebuilt core and Hermes downloads
      - name: Restore the CocoaPods cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('yarn.lock', 'example/yarn.lock', '*.podspec') }}
          restore-keys: pods-

      # Booted in the background while dependencies install; both xcodebuild
      # steps target this one simulator, so the test step reuses what the build
      # step compiled and only one architecture is built
      - name: Pick and boot a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: corepack enable && yarn install --immutable

      # Prebuild runs the config plugin, so the build also compiles the
      # AppDelegate.swift it generates
      - name: Build the Expo config plugin
        run: yarn build-plugin

      - name: Install example dependencies
        run: yarn install --immutable
        working-directory: example

      # example/ios is generated by prebuild and not committed; prebuild also
      # runs pod install. The example's plugins/withLibraryTests adds the
      # library's unit tests to the Podfile
      - name: Generate the example's iOS project
        run: npx expo prebuild --platform ios
        working-directory: example

      - name: Reset ccache stats
        run: ccache --zero-stats

      # Compile only: no signing, no JS bundle
      - name: Build for the simulator
        working-directory: example/ios
        env:
          SKIP_BUNDLING: '1'
        run: |
          status=0
          xcodebuild build \
            -workspace RNBDExample.xcworkspace \
            -scheme RNBDExample \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || status=$?
          # A failing script phase prints its error far above the summary
          grep -E "error:|warning: .*failed|\\*\\* BUILD" build.log | head -n 50 || true
          tail -n 100 build.log
          exit $status

      # The library's XCTest target (the podspec's test spec)
      - name: Run unit tests
        working-directory: example/ios
        env:
          SKIP_BUNDLING: '1'
          # Passed into the test process without the prefix: the hosted runners'
          # nsurlsessiond refuses the test process, so tests that need it to
          # create, cancel or pause real tasks skip themselves here
          TEST_RUNNER_RNBD_SKIP_BACKGROUND_SESSION_TESTS: '1'
        run: |
          # Wait until the simulator is fully up: on a cold one the tests start
          # before nsurlsessiond is ready, and setting up the background
          # URLSession fails its xpc connection
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}"
          xcodebuild test \
            -workspace RNBDExample.xcworkspace \
            -scheme react-native-background-downloader-Unit-Tests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200
          exit ${PIPESTATUS[0]}

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
