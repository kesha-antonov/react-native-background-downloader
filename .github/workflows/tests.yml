name: Tests

on:
  push:
    branches: [main, anorak-main]
  pull_request:

jobs:
  js:
    name: JS (typecheck, lint, jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: corepack enable && yarn install --immutable

      # plugin/build is generated, not committed, and the expo-plugin test
      # requires it through app.plugin.js
      - name: Build the Expo config plugin
        run: yarn build-plugin

      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # React Native's Android Gradle Plugin needs JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: corepack enable && yarn install --immutable

      # The example applies this library as an Expo config plugin, so prebuild
      # below loads app.plugin.js -> plugin/build/index.js
      - name: Build the Expo config plugin
        run: yarn build-plugin

      # The library resolves com.facebook.react:react-native from the example
      # app's node_modules, so the example has to be installed too
      - name: Install example dependencies
        run: yarn install --immutable
        working-directory: example

      # example/android is generated by prebuild and not committed
      - name: Generate the example's Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: example

      - name: Run unit tests
        run: ./gradlew :anorak-games_react-native-background-downloader:testDebugUnitTest
        working-directory: example/android

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/build/reports/tests/testDebugUnitTest

  ios:
    name: iOS (${{ matrix.architecture }})
    runs-on: macos-latest
    strategy:
      matrix:
        architecture: [new, old]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: corepack enable && yarn install --immutable

      - name: Build the library and Expo config plugin
        run: yarn build && yarn build-plugin

      - name: Install example dependencies
        run: yarn install --immutable
        working-directory: example

      - name: Generate the example's iOS project
        run: npx expo prebuild --platform ios --no-install
        working-directory: example

      - name: Install pods
        run: pod install
        working-directory: example/ios
        env:
          RCT_NEW_ARCH_ENABLED: ${{ matrix.architecture == 'new' && '1' || '0' }}
          RNBD_IOS_OLD_ARCH: ${{ matrix.architecture == 'old' && '1' || '0' }}

      - name: Build the example
        if: matrix.architecture == 'new'
        run: xcodebuild -workspace RNBDExample.xcworkspace -scheme RNBDExample -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: example/ios

      - name: Build the library pod
        if: matrix.architecture == 'old'
        run: xcodebuild -workspace RNBDExample.xcworkspace -scheme react-native-background-downloader -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: example/ios
