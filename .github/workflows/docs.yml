name: Docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - MIGRATION.md
      - docs/**
      - website/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - MIGRATION.md
      - docs/**
      - website/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Jobs that need more ask for it themselves
permissions:
  contents: read

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # website/ is a separate Yarn project, so it installs on its own. The
      # pages themselves are generated from README.md, docs/ and MIGRATION.md
      # by website/scripts/sync-docs.mjs, which `yarn build` runs first.
      - name: Install dependencies
        run: corepack enable && yarn install --immutable
        working-directory: website

      - name: Build
        run: yarn build
        working-directory: website

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    # One deployment at a time, without cancelling one that is mid-deploy. On
    # this job only: at the workflow level a pull request's run joined the group
    # too, and a newer queued run cancels a waiting one - including a deploy.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
