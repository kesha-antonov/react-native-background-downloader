compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

# A version must be out for 3 days before `yarn add`/`yarn up` picks it, which is
# usually long enough for a hijacked release to be caught and pulled
npmMinimalAgeGate: 3d

yarnPath: .yarn/releases/yarn-4.17.1.cjs
